[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoeye"
version = "1.0.0"
description = "EcoEye: Sistema de Computación Ubicua e Inteligencia Ambiental Asistencial"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Equipo EcoEye - HackaTec Regional 2026" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "websockets>=12.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ecoeye*"]
exclude = ["api*", "public*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
